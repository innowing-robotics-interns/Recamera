[project]
name = "recamera"
version = "0.2.0"
description = "Deploy compiled YOLO models to a Seeed Studio reCamera and view live detections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Innowing Robotics" }]
keywords = ["recamera", "seeed", "yolo", "cvimodel", "sg2002", "cv181x", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "websocket-client>=1.6.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# Converting a PyTorch checkpoint to ONNX on this computer.
convert = ["ultralytics>=8.3.0", "onnx>=1.14.0"]
# Running the test suite.
test = ["pytest>=8.0"]

[project.scripts]
recamera = "recamera.cli:main"

[project.urls]
Homepage = "https://github.com/innowing-robotics-interns/Recamera"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recamera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Correctness and cleanup only; the bandit/security rules are noise for a
# tool whose job is to talk to a local device.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # argparse defaults are evaluated at call time by design
